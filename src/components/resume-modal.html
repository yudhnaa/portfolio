<!-- Resume Viewer Modal Popup -->
		<div
			id="resumeModal"
			class="modal-overlay fixed inset-0 z-[100] flex items-center justify-center p-2 sm:p-4 md:p-5 bg-slate-950/75 backdrop-blur-md"
			role="dialog"
			aria-modal="true"
			aria-labelledby="resumeModalTitle"
			tabindex="-1"
		>
			<div
				class="modal-container w-full max-w-6xl h-[96vh] max-h-[1200px] rounded-3xl bg-white dark:bg-[#120f18] border border-slate-200/90 dark:border-white/10 shadow-2xl flex flex-col overflow-hidden relative"
			>
				<!-- Modal Header -->
				<div
					class="flex items-center justify-between gap-2 px-4 sm:px-6 py-3 border-b border-slate-200/80 dark:border-white/[0.08] bg-white/90 dark:bg-[#14111b]/90 backdrop-blur-md shrink-0"
				>
					<!-- Title -->
					<div class="flex items-center gap-2.5 shrink-0">
						<div
							class="w-8 h-8 rounded-lg bg-primary/10 text-primary flex items-center justify-center"
						>
							<span class="material-symbols-outlined text-lg">description</span>
						</div>
						<div class="flex flex-col">
							<h3
								id="resumeModalTitle"
								class="text-xs sm:text-sm font-bold text-slate-900 dark:text-white font-mono tracking-tight"
							>
								Resume Preview
							</h3>
							<span
								class="text-[10px] text-slate-500 dark:text-slate-400 font-mono hidden md:inline"
							>
								Duy Hoang Anh · Software Engineer
							</span>
						</div>
					</div>

					<!-- Segmented Switcher for Dual Stacks -->
					<div
						class="seg resume-mode shrink-0"
						role="radiogroup"
						aria-label="Resume Stack Selection"
					>
						<span
							class="seg__ind"
							id="resumeSegIndicator"
							aria-hidden="true"
						></span>
						<button
							type="button"
							class="on"
							data-resume="java"
							id="resumeTabJava"
							aria-label="Switch to Java Resume"
						>
							Java
						</button>
						<button
							type="button"
							data-resume="python"
							id="resumeTabPython"
							aria-label="Switch to Python Resume"
						>
							Python
						</button>
					</div>

					<!-- Actions: Open in Drive & Close -->
					<div class="flex items-center gap-1 shrink-0">
						<a
							id="resumeModalExternalBtn"
							href="https://drive.google.com/file/d/1AXolONUb5bktEMMGZB1CWUdH4Snm4pLc/view"
							target="_blank"
							rel="noopener noreferrer"
							class="flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-xl text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.08] transition-colors"
							title="Open in Google Drive"
							aria-label="Open in Google Drive"
						>
							<span class="material-symbols-outlined text-lg">open_in_new</span>
						</a>
						<button
							id="resumeModalCloseBtn"
							type="button"
							class="flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-xl text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.08] transition-colors"
							aria-label="Close resume preview"
						>
							<span class="material-symbols-outlined text-xl">close</span>
						</button>
					</div>
				</div>

				<!-- Modal Iframe Body -->
				<div
					class="relative flex-1 w-full bg-slate-100 dark:bg-[#08060b] overflow-y-auto"
				>
					<!-- Loading Skeleton State -->
					<div
						id="resumeLoadingSpinner"
						class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-slate-50/90 dark:bg-[#0c0a10]/90 z-10 transition-opacity duration-300"
					>
						<div
							class="w-10 h-10 rounded-full border-2 border-primary/20 border-t-primary animate-spin"
						></div>
						<p class="font-mono text-xs text-slate-500 dark:text-slate-400">
							Loading resume document...
						</p>
					</div>

					<!-- Java Embedded Resume -->
					<div
						id="resumeFrameJava"
						style="left: 0; width: 100%; height: 0; position: relative; padding-bottom: 129.4118%;"
					>
						<iframe
							id="resumeIframeJava"
							src=""
							title="Java Backend &amp; Microservices Resume"
							style="top: 0; left: 0; width: 100%; height: 100%; position: absolute; border: 0;"
							allowfullscreen
						></iframe>
					</div>

					<!-- Python Embedded Resume -->
					<div
						id="resumeFramePython"
						class="hidden"
						style="left: 0; width: 100%; height: 0; position: relative; padding-bottom: 129.4118%;"
					>
						<iframe
							id="resumeIframePython"
							src=""
							title="Python Backend &amp; AI Resume"
							style="top: 0; left: 0; width: 100%; height: 100%; position: absolute; border: 0;"
							allowfullscreen
						></iframe>
					</div>
				</div>
			</div>
		</div>
